<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>Arvin Vakili | Instagram</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(to bottom, #f3f3f3, #e0e0e0);
      overflow: hidden;
      text-align: center;
    }

    .follow-btn {
      margin-top: 20vh;
      padding: 15px 30px;
      background-color: #e1306c;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .floating {
      position: absolute;
      animation: float 6s ease-in-out infinite;
      width: 100px;
      opacity: 0.7;
    }

    .floating.handpan {
      top: 10%;
      left: 5%;
      animation-delay: 0s;
    }

    .floating.tombak {
      top: 70%;
      right: 5%;
      animation-delay: 3s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
  </style>
</head>
<body>

  <a class="follow-btn" href="https://www.instagram.com/arvin_vakilii" target="_blank">Follow on Instagram</a>

  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Handpan.png/240px-Handpan.png"
       class="floating handpan" alt="Handpan" />

  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/Tonbak.jpg/240px-Tonbak.jpg"
       class="floating tombak" alt="Tombak" />

</body>
</html>
